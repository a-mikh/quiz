server.port=8889

# H2 database stored in a local file.
# Data survives application restarts.
spring.datasource.url=jdbc:h2:file:./data/quizdb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Let Hibernate update the schema from JPA entities.
spring.jpa.hibernate.ddl-auto=update

# Useful while developing.
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# H2 browser console.
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Avoid database queries during JSON serialization.
spring.jpa.open-in-view=false

# Required for the actuator shutdown endpoint.
management.endpoint.shutdown.enabled=true
management.endpoints.web.exposure.include=shutdown
logging.level.org.springframework.security=TRACE